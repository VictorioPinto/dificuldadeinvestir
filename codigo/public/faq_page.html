<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ - Dificuldade de Investimento</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Seu CSS -->
  <link rel="stylesheet" href="faq.css">
</head>

<body>
  <header class="text-center p-4 bg-dark text-white">
    <h1>Perguntas Frequentes (FAQ)</h1>
  </header>

  <main class="container mt-4">
    <div class="search-container mb-4">
      <input 
        type="text" 
        id="searchInput" 
        class="form-control" 
        placeholder="Digite para buscar uma dúvida..."
      >
    </div>

    <!-- Container do FAQ -->
    <div id="faqContainer" class="accordion"></div>

    <div class="text-center mt-4">
      <button id="btnMostrarTodas" class="btn btn-secondary">Mostrar todas</button>
    </div>
  </main>

  <!-- Bootstrap JS (necessário para o accordion funcionar) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Seu JavaScript -->
  <script src="faq.js"></script>
</body>
</html>
