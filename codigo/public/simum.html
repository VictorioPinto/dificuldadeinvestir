<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Investimento</title>
    <link rel="stylesheet" href="assets/css/simum.css">
</head>
<body>

    <div class="calculcorpo">
        
        <h3>Tipo de investimento:</h3>
        
        <div class="radio-group-wrapper">
            <div class="radio-group-row">
            
                <input type="radio" id="tipo-tesouro" name="tipo_investimento" value="tesouro">
                <label for="tipo-tesouro">Tesouro</label>

                <input type="radio" id="index-cdi" name="tipo_investimento" value="cdi" checked>
                <label for="index-cdi" class="cdi-label">CDI</label>

                <input type="radio" id="tipo-cdb" name="tipo_investimento" value="cdb">
                <label for="tipo-cdb">CDB/LC</label>
            </div>
        </div>

        <div id="calc-form">
            
            <div class="form-columns">
                
                <div class="form-column-left">
                    
                    <div class="form-group">
                        <label for="inicial">Valor do investimento inicial</label>
                        <div class="input-wrapper prefix-r-cifrao">
                            <input type="number" id="inicial" value="1000" step="100">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mensal">Valor do investimento mensal</label>
                        <div class="input-wrapper prefix-r-cifrao">
                            <input type="number" id="mensal" value="200" step="50">
                        </div>
                    </div>

                    <div class="form-group-resultado">
                        <span class="resultado-label">Valor obtido: <strong id="resultado-obtido">R$ 0,00</strong></span>
                        <span class="resultado-label">Total investido: <strong id="resultado-investido">R$ 0,00</strong></span>
                    </div>

                    <input type="hidden" id="investimento-id" value="">
                            <button id="botao-salvar">Salvar Simulação</button>
                </div>

                <div class="form-column-right">
                    
                    <div class="form-group">
                        <label for="meses">Duração do investimento</label>
                        <div class="input-wrapper suffix-meses">
                            <input type="number" id="meses" value="12" step="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rentabilidade_valor">Rentabilidade:</label>
                        <div class="rentabilidade-group">
                            <div class="input-wrapper prefix-porcento">
                                <input type="number" id="rentabilidade_valor" value="1.1" step="0.1">
                            </div>
                            <select id="rentabilidade_periodo">
                                <option value="mensal" selected>men</option>
                                <option value="anual">ano</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

        <div class="lista-corpo">
         <h3>Simulações Salvas</h3>
         <div id="lista-simulacoes">
         <p>Se Carregar vai estar aqui</p>
         </div>
        </div>
    <script src="assets/js/contas.js"></script>

</body>
</html>
