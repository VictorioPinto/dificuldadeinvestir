<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wise Capital | Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- ESTILOS PERSONALIZADOS (Identidade Wise Capital) --- */
      body {
        background: linear-gradient(135deg, #1a2980, #26d0ce);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .login-card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        width: 100%;
        max-width: 450px;
        border: none;
        /* Animação suave de entrada */
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-header {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        padding: 30px 20px;
        text-align: center;
        border-bottom: 1px solid #dee2e6;
      }

      .logo-img {
        height: 60px;
        width: auto;
        margin-bottom: 10px;
        mix-blend-mode: multiply;
      }

      .brand-name {
        color: #1a2980;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 1px;
        margin: 0;
        text-transform: uppercase;
      }

      .login-body {
        padding: 40px 30px;
      }

      .form-floating > label {
        color: #718096;
      }

      .form-control:focus {
        border-color: #4facfe;
        box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
      }

      .btn-login {
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        border: none;
        color: white;
        font-weight: 700;
        padding: 12px;
        border-radius: 10px;
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        color: white;
      }

      .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #6c757d;
      }

      .register-link a {
        color: #1a2980;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      /* Modal Styles */
      .modal-header {
        background: linear-gradient(90deg, #1a2980, #26d0ce);
        color: white;
      }
      .modal-title {
        font-weight: 700;
      }
      .btn-close {
        filter: invert(1) grayscale(100%) brightness(200%);
      }
    </style>
  </head>
  <body>
    <div class="card login-card">
      <div class="brand-header">
        <img
          src="../../assets/images/logoazul.jpg"
          alt="Wise Capital Logo"
          class="logo-img"
        />
        <h2 class="brand-name">Wise Capital</h2>
      </div>

      <div class="login-body">
        <form id="login-form">
          <h4 class="text-center mb-4 text-secondary">Bem-vindo de volta!</h4>

          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Login"
              required
            />
            <label for="username"><i class="fas fa-user me-2"></i>Login</label>
          </div>

          <div class="form-floating mb-4">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Senha"
              required
            />
            <label for="password"><i class="fas fa-lock me-2"></i>Senha</label>
          </div>

          <button type="submit" class="btn btn-login">
            Entrar <i class="fas fa-sign-in-alt ms-2"></i>
          </button>

          <div class="register-link">
            Não tem uma conta?
            <a data-bs-toggle="modal" data-bs-target="#loginModal"
              >Registre-se agora</a
            >
          </div>
        </form>
      </div>
    </div>

    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">
              <i class="fas fa-user-plus me-2"></i>Novo Cadastro
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="register-form">
              <div class="mb-3">
                <label for="txt_nome" class="form-label">Nome Completo</label>
                <input
                  type="text"
                  class="form-control"
                  id="txt_nome"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="txt_email" class="form-label">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="txt_email"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="txt_login" class="form-label"
                  >Usuário (Login)</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="txt_login"
                  required
                />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="txt_senha" class="form-label">Senha</label>
                  <input
                    type="password"
                    class="form-control"
                    id="txt_senha"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="txt_senha2" class="form-label"
                    >Confirmar Senha</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="txt_senha2"
                    required
                  />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" id="btn_salvar" class="btn btn-primary">
              Salvar Cadastro
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/js/login.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Configurar evento de Login
        const loginForm = document.getElementById("login-form");
        if (loginForm) {
          loginForm.addEventListener("submit", processaFormLogin);
        }

        // 2. Configurar evento de Cadastro
        const btnSalvar = document.getElementById("btn_salvar");
        if (btnSalvar) {
          btnSalvar.addEventListener("click", salvaLogin);
        }
      });

      // Função para processar o formulário de login
      function processaFormLogin(event) {
        event.preventDefault();

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        const username = usernameInput.value;
        const password = passwordInput.value;

        // loginUser deve estar definido em ../../assets/js/login.js
        if (typeof loginUser !== "function") {
          console.error(
            "Erro: A função loginUser não foi encontrada. Verifique o import do login.js"
          );
          return;
        }

        const resultadoLogin = loginUser(username, password);

        if (resultadoLogin) {
          window.location.href = RETURN_URL;
        } else {
          alert("Usuário ou senha incorretos.");
          passwordInput.value = "";
          passwordInput.focus();
        }
      }

      // Função para salvar novo cadastro
      function salvaLogin(event) {
        event.preventDefault();

        let nome = document.getElementById("txt_nome").value;
        let email = document.getElementById("txt_email").value;
        let login = document.getElementById("txt_login").value;
        let senha = document.getElementById("txt_senha").value;
        let senha2 = document.getElementById("txt_senha2").value;

        if (!nome || !email || !login || !senha) {
          alert("Por favor, preencha todos os campos.");
          return;
        }

        if (senha !== senha2) {
          alert("As senhas informadas não conferem.");
          return;
        }

        // addUser deve estar definido em ../../assets/js/login.js
        if (typeof addUser !== "function") {
          console.error("Erro: A função addUser não foi encontrada.");
          return;
        }

        addUser(nome, login, senha, email);

        // Fecha o modal usando Bootstrap 5
        const myModalEl = document.getElementById("loginModal");
        const modal = bootstrap.Modal.getInstance(myModalEl);
        if (modal) {
          modal.hide();
        }

        // Limpa o formulário de cadastro
        document.getElementById("register-form").reset();
      }
    </script>
  </body>
</html>
